name: 24/7 Automated Fragrance Price Scraper

on:
  schedule:
    # Runs every hour at minute 0
    - cron: '0 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/scraper_cron.yml'
      - 'backend/scripts/run_scheduled_scrapers.py'
      - 'backend/scripts/verify_fragrance_list.py'
      - 'backend/scrapers/**'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  scrape_prices:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            httpx \
            curl_cffi \
            beautifulsoup4 \
            asyncpg \
            "sqlalchemy>=2.0" \
            pydantic \
            greenlet \
            python-dotenv

      - name: Run Scheduled Scraper & Price Tracker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: "backend:."
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -z "$DATABASE_URL" ] || [ "$DATABASE_URL" = "true" ] || [[ "$DATABASE_URL" != postgres* ]]; then
            echo "::error::DATABASE_URL secret is missing or invalid in repository secrets. Please configure DATABASE_URL in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          echo "Running pre-flight verification..."
          python -c "
          import sys, os
          sys.path.append('backend')
          try:
              import models.schema
              import scrapers.strict_matcher
              import scripts.verify_fragrance_list
              from scripts.run_scheduled_scrapers import format_async_db_url
              print('::notice::Pre-flight: Imports successful')
          except Exception as e:
              import traceback
              tb = traceback.format_exc().replace('\n', '%0A').replace('\r', '')
              print(f'::error title=Preflight Import Error::{tb}')
              sys.exit(1)
          "

          echo "Running pre-flight database connection test..."
          python -c "
          import sys, os, asyncio
          sys.path.append('backend')
          from scripts.run_scheduled_scrapers import format_async_db_url
          from sqlalchemy.ext.asyncio import create_async_engine
          from sqlalchemy import text

          async def test_db():
              url = format_async_db_url(os.getenv('DATABASE_URL'))
              engine = create_async_engine(url)
              async with engine.connect() as conn:
                  res = await conn.execute(text('SELECT count(*) FROM fragrance_dna;'))
                  cnt = res.scalar()
                  print(f'::notice::Pre-flight DB test passed! Fragrance DNA count: {cnt}')
              await engine.dispose()

          try:
              asyncio.run(test_db())
          except Exception as e:
              import traceback
              tb = traceback.format_exc().replace('\n', '%0A').replace('\r', '')
              print(f'::error title=Preflight DB Test Error::{tb}')
              sys.exit(1)
          "

          echo "Starting full scheduled scraper run..."
          python backend/scripts/run_scheduled_scrapers.py

