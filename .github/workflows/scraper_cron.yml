name: 24/7 Automated Fragrance Price Scraper

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/scraper_cron.yml'
      - 'backend/scripts/run_scheduled_scrapers.py'
      - 'backend/scripts/verify_fragrance_list.py'
      - 'backend/scrapers/**'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  scrape_prices:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            httpx \
            curl_cffi \
            beautifulsoup4 \
            asyncpg \
            "sqlalchemy>=2.0" \
            pydantic \
            greenlet \
            python-dotenv

      - name: Run Scheduled Scraper & Price Tracker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://neondb_owner:npg_iN45StWGXmpK@ep-winter-surf-ay718z8s-pooler.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require' }}
          PYTHONPATH: "backend:."
          PYTHONUNBUFFERED: "1"
        run: |
          python backend/scripts/run_scheduled_scrapers.py
